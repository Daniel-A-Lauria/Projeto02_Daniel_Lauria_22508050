<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaExpress</title>
    <link rel="stylesheet" href="css/style.css">
</head>  
<body>
    <header class="logo">
        <h1>RotaExpress: Sistema de Gestão de Encomendas e Frete</h1>
        <div id="info-usuario" class="usuario-logado" style="display: none;">
        <span id="usuario-email"></span>        
        <button type="button" id="btn-logout" class="btn-sair" style="display: none;">Sair</button>
    </div>
    </header>
<br>
    <section id="tela-login" class="login-container">
        <div class="card">
            <h2>Acesso Restrito</h2>
            <p>Entre com suas credenciais para gerenciar as encomendas.</p>
            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">E-mail:</label>
                    <input type="email" id="login-email" placeholder="admin@rotaexpress.com" required>
                </div>
                <br>
                <div class="form-group">
                    <label for="login-senha">Senha:</label>
                    <input type="password" id="login-senha" placeholder="Digite sua senha" required>
                </div>
                <br>
                <button type="submit" id="btn-login">ENTRAR</button>
                <p id="login-msg" class="status error"></p>
            </form>
        </div>
    </section>

    <main class="container">
        <div class="card">
            <form id="form-endereco">
                <label for="destinatario">Destinatário:</label>
                <div class="destinatario-container">            
                    <input type="text" id="destinatario" placeholder="Digite o nome do destinatário" required>
                    <button type="button" id="btn-limpar">Limpar</button>
                </div>
                <br>

                <label for="peso">Peso (em KG):</label>
                <div class="form-peso">
                    <input type="number" id="peso" placeholder="Digite o peso em kg" step="0.1" required>
                </div>
                <br>

                <label for="modalidade">Modalidade:</label>
                <div class="form-modalidade">
                    <select name="modalidade" id="modalidade">
                        <option value="normal">Normal</option>
                        <option value="expresso">Expresso</option>
                        <option value="super">Super Expresso</option>
                    </select>
                </div>
                <br>

                <label for="cep">CEP:</label>
                <div class="cep-container">
                    <input type="text" id="cep" placeholder="Ex: 71219900" maxlength="8" required>
                    <button type="button" id="btn-buscar">Buscar CEP</button>
                </div>
                <br>

                <label for="logradouro">Logradouro / Rua:</label>
                <div class="form-group">
                    <input type="text" id="logradouro" readonly>
                </div>
                <br>

                <label for="bairro">Bairro:</label>
                <div class="form-group">
                    <input type="text" id="bairro" readonly>
                </div>
                <br>

                <label for="cidade">Cidade / UF:</label>
                <div class="form-group">
                    <input type="text" id="cidade" readonly>
                </div>
                <br>

                <label for="numero">Número (Digite manualmente): </label>
                <div class="form-group">
                    <input type="text" id="numero" placeholder="Ex: 67" required>
                </div>
                <br>

                <button type="button" id="btn-cadastrar">CADASTRAR</button>
                <div id="status-msg" class="status"></div>
            </form>
        <br>            
        <section id="painel-metricas">
            <p>Total de Encomendas: <span id="metrica-total">0</span></p>
            <p>Faturação Acumulada: <span id="metrica-faturamento">R$ 0,00</span></p>
        </section>
        </div>
        <br>
        <div id="lista-encomendas" class="grid-encomendas"></div>
        <section class="coluna-cards">
                <div id="lista-encomendas" class="grid-encomendas"></div>
            </section>
        </main>
    </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
